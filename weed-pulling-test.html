<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8efdf">
<title>拔草模擬器｜鏟土與連根拔起 v0.3</title>
<style>
:root{color-scheme:light;--green:#263f31;--muted:#6e806e;--light:#f8faf4;--edge:#d7e0d0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden;background:#e6eddd;color:var(--green);font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;padding:calc(15px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
#head{display:flex;justify-content:space-between;align-items:start;gap:8px}
.eyebrow{font-size:10px;font-weight:850;letter-spacing:.18em;color:#789275}
h1{font-size:23px;letter-spacing:.025em;font-weight:850;margin:4px 0 4px}
.note{font-size:12px;color:#71846f}
.counter{padding:8px 12px;background:#fbfcf4ef;border:1px solid #fff;border-radius:15px;white-space:nowrap;box-shadow:0 7px 19px #52644f18}
.counter b{font-size:21px;font-variant-numeric:tabular-nums}.counter small{font-size:11px;color:#7b8d7b}
#banner{align-self:center;margin-top:9vh;opacity:0;transform:translateY(8px);transition:opacity .22s,transform .22s;border:1px solid #fff5c6;background:#fff9e8ed;border-radius:15px;text-align:center;padding:10px 24px;box-shadow:0 10px 28px #594d2921;min-width:160px}
#banner.show{opacity:1;transform:translateY(0)}
#banner small{display:block;font-size:11px;letter-spacing:.1em;color:#a38c56}
#banner strong{display:block;font-size:27px;color:#88612f;font-variant-numeric:tabular-nums}
#footer{width:min(100%,535px);align-self:center;text-align:center}
#tip{min-height:24px;font-size:13px;font-weight:700;color:#49634a;text-shadow:0 1px 2px #f5f9eb;margin-bottom:8px}
#buttons{display:flex;justify-content:center;gap:7px;pointer-events:auto;flex-wrap:wrap}
button{border:1px solid #d4decf;background:#fcfff6ed;color:#47634b;border-radius:13px;min-height:43px;padding:0 11px;box-shadow:0 5px 14px #4d63421b;font:750 12px system-ui,-apple-system,"PingFang TC",sans-serif;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.97);background:#eef3e8}
button.primary{background:#315c41;border-color:#315c41;color:#fff}
#message{position:fixed;top:32%;left:50%;max-width:93vw;text-align:center;pointer-events:none;transform:translate(-50%,-7px) scale(.96);opacity:0;transition:opacity .2s,transform .2s;background:#fbfdf4f2;color:#274632;padding:12px 18px;border-radius:16px;border:1px solid #ffffffea;box-shadow:0 12px 32px #43523f35;font-weight:850;font-size:18px;white-space:nowrap}
#message.show{opacity:1;transform:translate(-50%,0) scale(1)}
#help{position:fixed;left:50%;top:58%;transform:translate(-50%,-50%);pointer-events:none;color:#fdfde8;text-shadow:0 2px 5px #274226aa;opacity:0;font-weight:850;font-size:14px;transition:opacity .4s;white-space:nowrap}
#help.show{opacity:1}
#finish{position:fixed;inset:0;display:none;background:#273b2d71;backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:18px}
#finish.show{display:flex}
.card{width:min(94vw,332px);padding:30px 25px;background:#f9fcf4;border-radius:25px;text-align:center;box-shadow:0 22px 60px #1e352f60}
.card .big{font-size:40px}.card h2{font-size:24px;margin:8px 0}.card p{font-size:14px;color:#687d6b;line-height:1.8}.card button{margin-top:10px;min-width:160px}
.version{position:fixed;bottom:calc(67px + env(safe-area-inset-bottom));right:10px;font-size:10px;color:#8a9b81;pointer-events:none}
@media(max-width:390px){h1{font-size:21px}.note{font-size:11px}button{padding:0 9px;font-size:11px;min-height:40px}#hud{padding-left:9px;padding-right:9px}}
@media(max-height:630px){h1{font-size:18px}.eyebrow{font-size:9px}.note{display:none}#banner{margin-top:1vh}.version{display:none}#tip{margin-bottom:3px}}

#tools{position:fixed;right:calc(11px + env(safe-area-inset-right));bottom:calc(105px + env(safe-area-inset-bottom));display:flex;gap:9px;pointer-events:auto}
#tools button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;width:65px;height:68px;border-radius:18px;border:2px solid #d6e3d0;background:#ffffffed;box-shadow:0 6px 20px #2e4a3825;color:#4e6d50;padding:3px;font-size:12px;transition:background .12s,border-color .12s,transform .12s}
#tools button.selected{background:#32583d;color:#fff;border-color:#b3d0aa;box-shadow:0 6px 19px #315c4169}
#tools button:active{transform:scale(.95)}
.toolIcon{font-size:29px;line-height:34px;width:37px;height:36px;display:flex;align-items:center;justify-content:center}
#tools svg.toolIcon{width:38px;height:38px;padding:3px}
#modeGuide{position:fixed;bottom:calc(182px + env(safe-area-inset-bottom));right:13px;background:#fbfff3e0;padding:5px 9px;border:1px solid #d9e5ce;border-radius:10px;font-size:11px;color:#4c644b;pointer-events:none}
#head .counter{margin-left:8px}
@media(max-height:640px){#tools{bottom:calc(64px + env(safe-area-inset-bottom))}#tools button{width:55px;height:55px}#modeGuide{bottom:calc(126px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<canvas id="scene" aria-label="2.5D 拔草遊戲，按住雜草往畫面上方拉"></canvas>
<div id="hud">
 <div id="head"><div><div class="eyebrow">ARMY / GARDEN · 2.5D</div><h1>拔草模擬器</h1><div class="note">先鏟鬆土壤，再親手連根拔起</div></div><div class="counter"><b id="done">0</b><small> / <span id="total">0</span> 叢</small></div></div>
 <div id="footer"><div id="tip">先選鏟子挖土，想拔草再選「手」</div><div id="buttons"><button id="sound">🔊 音效</button><button id="reset">換片草地</button></div></div>
 <div id="tools" role="group" aria-label="選擇操作工具">
 <button id="handTool" aria-label="切換成手拔草"><span class="toolIcon">✋</span><span>手</span></button>
 <button id="shovelTool" class="selected" aria-label="切換成鏟子鬆土"><svg class="toolIcon" viewBox="0 0 42 42" aria-hidden="true"><path d="M24 7L14 25" fill="none" stroke="currentColor" stroke-width="4.6" stroke-linecap="round"/><path d="M28.2 4.7l-4.4-2.4-6 10.6 4.4 2.3z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M13.6 24.6c-3.9 1.4-8.1 4.7-6.9 10.2l7.6 4.3c4.8-3.7 5.6-8.6 4.5-12.3z" fill="currentColor" opacity=".91"/></svg><span>鏟子</span></button>
 </div>
 </div>
<div id="modeGuide">目前：鏟子</div><div id="message"></div><div id="help" class="show">先用鏟子挖鬆土壤，再切換手拔草</div>
<div id="finish"><div class="card"><div class="big">🌱</div><h2>斬草除根。</h2><p id="report">班長說：旁邊還有一片。</p><button id="again" class="primary">再拔一片</button></div></div>
<div class="version">獨立試玩 · v0.3</div>
<script>

(function(){
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});
const UI={done:document.getElementById('done'),total:document.getElementById('total'),tip:document.getElementById('tip'),toast:document.getElementById('message'),help:document.getElementById('help'),finish:document.getElementById('finish'),report:document.getElementById('report'),guide:document.getElementById('modeGuide'),hand:document.getElementById('handTool'),shovel:document.getElementById('shovelTool')};
const CELL=.52,dirs=[[1,0],[-1,0],[0,1],[0,-1]],R=Math.PI*2;
let W=0,H=0,DPR=1,S=38,baseY=450,time=0,last=0,tool='shovel',plants=[],tiles=new Map(),groups=[],particles=[],rings=[],shovels=[];
let pointer=null,total=0,removed=0,toastUntil=0,finishAt=0,audioCtx=null,noise=null,mute=false,seed=Math.random()*999;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function smooth(x){x=clamp(x,0,1);return x*x*(3-2*x)}
function key(ix,iz){return ix+','+iz}
function coord(x,z){return{ix:Math.floor(x/CELL),iz:Math.floor(z/CELL)}}
function inside(x,z){return x*x/(4.78*4.78)+z*z/(4.39*4.39)<.97}
function project(x,z,y=0){const k=1-z*.021;return{x:W*.5+x*S*k,y:baseY+z*S*.67-x*S*.08-y*S*.98}}
function unproject(px,py){let z=(py-baseY)/(S*.67),x=0;for(let i=0;i<5;i++){x=(px-W*.5)/(S*(1-z*.021));z=(py-baseY+x*S*.08)/(S*.67)}return{x,z}}
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);S=Math.min(76,W/9.85,H/12.3);baseY=H*(H<620?.57:.582)}
addEventListener('resize',resize,{passive:true});resize();
function enableSound(){if(mute)return;try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();noise=audioCtx.createBuffer(1,Math.round(audioCtx.sampleRate*.26),audioCtx.sampleRate);const p=noise.getChannelData(0);for(let i=0;i<p.length;i++)p[i]=Math.random()*2-1}if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function noiseSound(volume,freq,dur){if(!audioCtx||mute||!noise)return;try{const now=audioCtx.currentTime,s=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();s.buffer=noise;f.type='bandpass';f.frequency.value=freq;f.Q.value=.6;g.gain.setValueAtTime(Math.max(.0001,volume),now);g.gain.exponentialRampToValueAtTime(.0001,now+dur);s.connect(f);f.connect(g);g.connect(audioCtx.destination);s.start(now);s.stop(now+dur)}catch(e){}}
function pop(vol=.75){if(!audioCtx||mute)return;try{const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(rand(245,310),now);o.frequency.exponentialRampToValueAtTime(rand(80,110),now+.115);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.18*vol,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+.13);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.14);noiseSound(.055*vol,950,.083)}catch(e){}}
function digSound(){noiseSound(.075,430,.16);if(audioCtx&&!mute)try{const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.setValueAtTime(108,now);o.frequency.exponentialRampToValueAtTime(61,now+.09);g.gain.setValueAtTime(.05,now);g.gain.exponentialRampToValueAtTime(.0001,now+.11);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.12)}catch(e){}}
function buzz(v){try{if(navigator.vibrate)navigator.vibrate(v)}catch(e){}}
function toast(text,ms=1350){UI.toast.textContent=text;UI.toast.classList.add('show');toastUntil=performance.now()+ms}
function makePlant(x,z,type){return{x,z,type,need:type==='tough'?3:1,loose:0,state:'live',broken:false,height:rand(.72,1.19),seed:rand(0,999),leaves:Math.floor(rand(5,9)),tug:0}}
function newGarden(){
plants=[];tiles=new Map();groups=[];particles=[];rings=[];shovels=[];removed=0;total=0;pointer=null;finishAt=0;seed=Math.random()*900;
UI.finish.classList.remove('show');UI.help.classList.add('show');UI.tip.textContent='先用鏟子挖土，想拔草再選「手」';
let count=Math.min(20,Math.max(11,Math.floor(W/29))),tries=0;
while(plants.length<count&&tries++<1200){const x=rand(-3.85,3.85),z=rand(-3.4,3.6);if(!inside(x,z))continue;let valid=true;for(const p of plants){if(Math.hypot((p.x-x)*1.04,(p.z-z)*.9)<.93){valid=false;break}}if(valid)plants.push(makePlant(x,z,Math.random()<.26?'tough':'normal'))}
total=plants.length;plants.sort((a,b)=>a.z-b.z);UI.done.textContent='0';UI.total.textContent=String(total);setTool('shovel');
}
function setTool(next){if(pointer)pointer=null;tool=next;UI.hand.classList.toggle('selected',tool==='hand');UI.shovel.classList.toggle('selected',tool==='shovel');UI.guide.textContent='目前：'+(tool==='shovel'?'鏟子':'手');UI.tip.textContent=tool==='shovel'?'點擊或滑過土地刨鬆，空地也能鏟':'抓住已鏟鬆的草向上拉；土塊連通就會一起拔'}
UI.hand.addEventListener('click',()=>setTool('hand'));UI.shovel.addEventListener('click',()=>setTool('shovel'));
document.getElementById('reset').addEventListener('click',newGarden);
document.getElementById('again').addEventListener('click',newGarden);
document.getElementById('sound').addEventListener('click',function(){mute=!mute;this.textContent=mute?'🔇 靜音':'🔊 音效';if(!mute)enableSound()});
function getTile(ix,iz,create=false){const k=key(ix,iz);let c=tiles.get(k);if(!c&&create){const x=(ix+.5)*CELL,z=(iz+.5)*CELL;if(!inside(x,z))return null;c={ix,iz,level:0,status:'dug',group:null};tiles.set(k,c)}return c}
function tileOf(p){const a=coord(p.x,p.z);return getTile(a.ix,a.iz)}
function emit(x,y,count,color='#b49a78',force=1){for(let i=0;i<count;i++){const theta=rand(-Math.PI+.17,-.06),v=rand(30,105)*force;particles.push({x:x+rand(-6,6),y:y+rand(-3,3),vx:Math.cos(theta)*v,vy:Math.sin(theta)*v,gravity:rand(130,300),size:rand(1.3,4.8),color,life:rand(.35,.94),age:0})}if(particles.length>500)particles.splice(0,particles.length-500)}
function ring(x,y,r=40){rings.push({x,y,r,age:0})}
function dig(x,z){
if(!inside(x,z))return false;let worked=0;
const center=coord(x,z);
for(let ix=center.ix-2;ix<=center.ix+2;ix++)for(let iz=center.iz-2;iz<=center.iz+2;iz++){
const tx=(ix+.5)*CELL,tz=(iz+.5)*CELL;
if(Math.hypot(tx-x,tz-z)>.69)continue;
const cell=getTile(ix,iz,true);
if(!cell||cell.status!=='dug')continue;cell.level=Math.min(5,cell.level+1);worked++;
}
if(!worked)return false;
for(const p of plants){if(p.state!=='live')continue;if(Math.hypot(p.x-x,p.z-z)<.78){p.loose=Math.min(5,p.loose+1);const c=coord(p.x,p.z),tile=getTile(c.ix,c.iz,true);if(tile&&tile.status==='dug')tile.level=Math.max(1,tile.level)}}
const point=project(x,z);
shovels.push({x:point.x,y:point.y,age:0});emit(point.x,point.y,15,'#ab8e6b',1.25);emit(point.x,point.y,6,'#d3b88f',.67);ring(point.x,point.y,26);digSound();buzz(8);
return true;
}
function nearestLeaf(screen,limit){let pick=null,best=limit;for(const p of plants){if(p.state!=='live')continue;const pos=project(p.x,p.z,p.tug*.20);const y=pos.y-(p.broken?12:p.height*S*.60),distance=Math.hypot(screen.x-pos.x,(screen.y-y)*.9);if(distance<best){best=distance;pick=p}}return pick}
function digSpot(screen){const near=nearestLeaf(screen,Math.max(36,S*.92));if(near)return{x:near.x,z:near.z};return unproject(screen.x,screen.y)}
function connected(v){
const root=tileOf(v);if(!root||root.status!=='dug'||!root.level)return null;
const todo=[root],seen=new Set(),all=[];
for(let i=0;i<todo.length;i++){const cell=todo[i],k=key(cell.ix,cell.iz);if(seen.has(k)||cell.status!=='dug'||cell.level===0)continue;seen.add(k);all.push(cell);
for(const d of dirs){const nb=getTile(cell.ix+d[0],cell.iz+d[1]);if(nb&&nb.status==='dug'&&nb.level>0&&!seen.has(key(nb.ix,nb.iz)))todo.push(nb)}
}
const members=plants.filter(p=>p.state==='live'&&seen.has(key(coord(p.x,p.z).ix,coord(p.x,p.z).iz)));
return{cells:all,members,cellKeys:seen};
}
function startLift(p){
const component=connected(p);if(!component||!component.members.length){toast('這片土還沒連起來',1000);return}
const g={cells:component.cells,cellKeys:component.cellKeys,members:component.members,age:0,duration:2.42,phase:0,cx:0,cz:0};
g.cx=g.cells.reduce((s,c)=>s+(c.ix+.5)*CELL,0)/g.cells.length;
g.cz=g.cells.reduce((s,c)=>s+(c.iz+.5)*CELL,0)/g.cells.length;
for(const c of g.cells){c.status='lifting';c.group=g}
for(const member of g.members){member.state='lifting';member.tug=0}
groups.push(g);pointer=null;
const projected=project(g.cx,g.cz);
ring(projected.x,projected.y,Math.min(128,33+g.cells.length*2.6));
emit(projected.x,projected.y,18,'#c7aa80',1.6);pop(1.15);buzz([13,42,20]);
if(g.members.length>1){toast('連根拔起！'+g.members.length+' 株一起出來！',1600);UI.tip.textContent='鏟鬆的土地連起來，就能一次掀起整片'}
else{UI.tip.textContent='啵！草根和土塊一起拔出來了'}
}
function breakStem(p){
if(p.broken)return;
p.broken=true;p.tug=0;pointer=null;
const q=project(p.x,p.z);emit(q.x,q.y-18,10,'#71914a',1);ring(q.x,q.y,25);
noiseSound(.07,720,.13);pop(.3);buzz([14,60,12]);
toast('啪！草斷了，根還在土裡！',1650);
UI.tip.textContent='放手，換鏟子再多鏟幾下，最後還能拔出草根';
}
function eventXY(e){const box=canvas.getBoundingClientRect();return{x:e.clientX-box.left,y:e.clientY-box.top}}
function pointerDown(e){
if(e.target!==canvas||UI.finish.classList.contains('show'))return;
enableSound();const pos=eventXY(e);UI.help.classList.remove('show');
if(tool==='shovel'){
const spot=digSpot(pos);
const ok=dig(spot.x,spot.z);
if(ok){const nearby=plants.find(p=>p.state==='live'&&Math.hypot(p.x-spot.x,p.z-spot.z)<.67&&p.need>1&&p.loose<p.need);
UI.tip.textContent=nearby?'頑固草：已鏟 '+nearby.loose+' / '+nearby.need+' 下，需要繼續鏟':'土變鬆了！可一直鏟，也能滑動把土區接起來';
pointer={id:e.pointerId,type:'shovel',lastX:spot.x,lastZ:spot.z,lastTime:performance.now()};}
}else{
const weed=nearestLeaf(pos,Math.max(38,S*1.05));
if(!weed){UI.tip.textContent='請先抓住草葉或斷掉的草根';return}
if(weed.loose<=0){toast('先用鏟子把土刨鬆！',1100);UI.tip.textContent='目前還沒鏟土，這株拔不動';buzz(7);return}
pointer={id:e.pointerId,type:'hand',weed,lastY:pos.y,dy:0,started:performance.now()};
if(weed.loose<weed.need){UI.tip.textContent='拔不動！這株很頑固，放手再多鏟 '+(weed.need-weed.loose)+' 下';noiseSound(.03,410,.075)}
else{UI.tip.textContent=weed.broken?'抓住殘根，慢慢往上拔':'往上拉！如果土區有連通，就會整片一起掀起'}
}
try{canvas.setPointerCapture(e.pointerId)}catch(e2){}e.preventDefault();
}
function pointerMove(e){
if(!pointer||e.pointerId!==pointer.id)return;
e.preventDefault();const pos=eventXY(e);
if(pointer.type==='shovel'){
const spot=unproject(pos.x,pos.y),dist=Math.hypot(spot.x-pointer.lastX,spot.z-pointer.lastZ);
if(dist>.32){const steps=Math.min(14,Math.ceil(dist/.31)),x0=pointer.lastX,z0=pointer.lastZ;
for(let s=1;s<=steps;s++){const at=s/steps;dig(lerp(x0,spot.x,at),lerp(z0,spot.z,at))}
pointer.lastX=spot.x;pointer.lastZ=spot.z;pointer.lastTime=performance.now();}
}else{
const p=pointer.weed,dy=Math.max(0,pointer.lastY-pos.y);pointer.lastY=pos.y;pointer.dy+=dy;
if(p.loose<p.need){p.tug=Math.min(.18,pointer.dy/450);if(pointer.dy>119){breakStem(p)}else if(dy>2&&Math.random()<.2){noiseSound(.027,380,.06)}}
else{p.tug=Math.min(.80,pointer.dy/100);if(pointer.dy>68){startLift(p)}else if(dy>2&&Math.random()<.25)noiseSound(.038,620,.06)}
}
}
function pointerUp(e){if(!pointer||pointer.id!==e.pointerId)return;if(pointer.type==='hand'&&pointer.weed.state==='live'){pointer.weed.tug=0;if(pointer.weed.loose<pointer.weed.need)UI.tip.textContent='很好，沒有硬拉斷！切鏟子多鏟幾下再試'}pointer=null}
canvas.addEventListener('pointerdown',pointerDown);canvas.addEventListener('pointermove',pointerMove);
canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);canvas.addEventListener('contextmenu',e=>e.preventDefault());
function polygon(pts,fill,stroke=null,width=1){ctx.beginPath();for(let i=0;i<pts.length;i++){const p=pts[i];if(i)ctx.lineTo(p.x,p.y);else ctx.moveTo(p.x,p.y)}ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function oval(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,R);ctx.fillStyle=color;ctx.fill()}
function cellCorners(c,transform){const x=c.ix*CELL,z=c.iz*CELL;return[transform(x,z),transform(x+CELL,z),transform(x+CELL,z+CELL),transform(x,z+CELL)]}
function drawBackground(){
const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#eaf1e3');sky.addColorStop(.55,'#d9e8d2');sky.addColorStop(1,'#d8e2d0');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#c9dcc1';ctx.beginPath();ctx.moveTo(0,H*.40);for(let x=0;x<=W+20;x+=14)ctx.lineTo(x,H*.43+Math.sin(x*.015+3)*11);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
ctx.fillStyle='#b9cfaf';ctx.beginPath();ctx.moveTo(0,H*.49);for(let x=0;x<=W+20;x+=14)ctx.lineTo(x,H*.51+Math.sin(x*.015+2)*13);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
ctx.save();ctx.globalAlpha=.19;ctx.strokeStyle='#648364';const yy=baseY-4.1*S;ctx.lineWidth=1.6;for(let x=0;x<W+S;x+=S*1.35){ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x,yy-51);ctx.stroke()}for(let k=0;k<2;k++){ctx.beginPath();ctx.moveTo(0,yy-42+k*19);ctx.lineTo(W,yy-42+k*19);ctx.stroke()}ctx.restore();
const perimeter=[],lower=[];
for(let i=0;i<=72;i++){const a=i/72*R,r=1+Math.sin(a*11+seed)*.012;const x=Math.cos(a)*4.95*r,z=Math.sin(a)*4.55*r;perimeter.push(project(x,z));lower.push(project(x,z,-.46))}
ctx.save();ctx.shadowColor='#4a594547';ctx.shadowBlur=28;ctx.shadowOffsetY=14;polygon(lower,'#695c4c');ctx.restore();polygon(lower,'#887052','#66513c',1);
for(let i=0;i<72;i++)if(perimeter[i].y>baseY-2*S)polygon([perimeter[i],perimeter[i+1],lower[i+1],lower[i]],i%2?'#977a5b':'#8b6f51','#7a6049',.6);
const soil=ctx.createLinearGradient(0,baseY-3*S,0,baseY+3*S);soil.addColorStop(0,'#899777');soil.addColorStop(.45,'#8b9872');soil.addColorStop(1,'#ac9673');polygon(perimeter,soil,'#c6b28d',2.1);
ctx.save();ctx.globalAlpha=.30;for(let i=0;i<100;i++){const x=Math.sin(i*12.18+seed)*4.23,z=Math.sin(i*7.33+seed)*4.02;if(!inside(x,z))continue;const p=project(x,z),sz=(i%4+1)*.42;oval(p.x,p.y,sz*2.2,sz*.8,i%4?'#526444':'#d7c69a')}ctx.restore();
}
function drawSurface(){
const cells=Array.from(tiles.values()).sort((a,b)=>a.iz-b.iz);
for(const c of cells){const quad=cellCorners(c,(x,z)=>project(x,z));const n=c.level;
if(c.status==='dug'){
polygon(quad,n>=3?'#8b7658':n===2?'#998062':'#a58a66','#85694e',.7);
const p=project((c.ix+.5)*CELL,(c.iz+.5)*CELL);
ctx.save();ctx.globalAlpha=.36+.07*n;ctx.strokeStyle=n>=3?'#dec39d':'#cfb28e';ctx.lineWidth=Math.min(2,1+n*.19);
for(let i=0;i<3;i++){const ix=Math.sin(c.ix*19+c.iz*7+i*2)*7,iz=Math.cos(c.iz*13+c.ix*3+i)*4;ctx.beginPath();ctx.moveTo(p.x-8+ix,p.y+iz-2);ctx.quadraticCurveTo(p.x+ix,p.y+iz-5,p.x+8+ix,p.y+iz);ctx.stroke()}ctx.restore();
}else{
polygon(quad,'#534736','#85694d',.9);
const cp=project((c.ix+.5)*CELL,(c.iz+.5)*CELL);if((c.ix+c.iz)%2===0)oval(cp.x,cp.y,2,1,'#3e362a');
}}
}
function leaf(x,y,dx,dy,width,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x+dx*.13-width,y+dy*.3,x+dx*.74-width*.67,y+dy*.94,x+dx,y+dy);ctx.bezierCurveTo(x+dx*.72+width*.6,y+dy*.65,x+dx*.25+width*.5,y+dy*.23,x,y);ctx.fill();ctx.strokeStyle='#b2d08d72';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+dx*.45,y+dy*.48,x+dx*.87,y+dy*.9);ctx.stroke()}
function plantAt(p,pt,alpha=1){ctx.save();ctx.globalAlpha=alpha;const height=(p.broken?.19:1)*p.height*S,wind=Math.sin(time*1.8+p.seed)*1.7;
if(p.broken){ctx.strokeStyle='#517143';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(pt.x,pt.y);ctx.lineTo(pt.x+3,pt.y-10);ctx.stroke();leaf(pt.x,pt.y,-5,-12,3,'#658a4d');ctx.restore();return}
for(let i=0;i<p.leaves;i++){const off=i-(p.leaves-1)/2,theta=off*.35+Math.sin(p.seed+i)*.1,len=height*(.61+(i%3)*.13),dx=Math.sin(theta)*len+wind,dy=-Math.cos(theta)*len;leaf(pt.x,pt.y,dx,dy,Math.max(4,height*.085),i%4===0?'#3f7144':i%3===0?'#56874b':i%2===0?'#7eab64':'#608f4f')}
ctx.restore()}
function groundPlant(p){const pos=project(p.x,p.z,p.tug*.22);oval(pos.x,pos.y+2,12,4,'#3f4c3370');if(p.tug>.01){ctx.strokeStyle='#dcc29a';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(pos.x,pos.y+14);ctx.quadraticCurveTo(pos.x+9,pos.y+4,pos.x,pos.y-7);ctx.stroke()}
plantAt(p,pos);if(p.need>1&&p.loose>0&&p.loose<p.need){ctx.save();const txt=(p.need-p.loose)+'鏟';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillStyle='#f8edce';const q=project(p.x,p.z);ctx.beginPath();ctx.roundRect(q.x-17,q.y-p.height*S-28,34,18,7);ctx.fill();ctx.fillStyle='#886331';ctx.fillText(txt,q.x,q.y-p.height*S-15);ctx.restore()}}
function boundary(g,c,dx,dz){return!g.keys.has(key(c.ix+dx,c.iz+dz))}
function transformLift(g,x,z,below=false){
const f=clamp(g.age/g.duration,0,1),pull=smooth((f-.12)/.54),exit=smooth((f-.74)/.26);
const lift=1.9*pull+2.10*exit+Math.sin(time*18)*.035*pull;
const shift=.75*exit,tilt=.22*pull;
return project(x+shift,z-.48*exit,lift+tilt*(x-g.cx)-(below?.42:0));
}
function drawLift(g){
const f=clamp(g.age/g.duration,0,1),lift=smooth((f-.12)/.56),fade=1-smooth((f-.85)/.15);
const middle=project(g.cx,g.cz),radius=Math.min(130,18+Math.sqrt(g.cells.length)*S*.46);ctx.save();ctx.globalAlpha=fade;
oval(middle.x,middle.y,radius,Math.max(9,radius*.45),'#574a3890');
const ordered=g.cells.slice().sort((a,b)=>a.iz-b.iz);
for(const c of ordered){const top=cellCorners(c,(x,z)=>transformLift(g,x,z,false)),low=cellCorners(c,(x,z)=>transformLift(g,x,z,true));
if(boundary(g,c,0,1))polygon([top[3],top[2],low[2],low[3]],'#876645','#604b33',.8);
if(boundary(g,c,1,0))polygon([top[1],top[2],low[2],low[1]],'#987351','#604b33',.8);
if(boundary(g,c,-1,0))polygon([top[0],top[3],low[3],low[0]],'#977455','#604b33',.8);
if(boundary(g,c,0,-1))polygon([top[0],top[1],low[1],low[0]],'#947353','#604b33',.8)}
ctx.save();ctx.lineCap='round';ctx.strokeStyle='#dfc7a1';ctx.lineWidth=2;
let strands=0;for(const c of ordered){for(const [dx,dz] of dirs){if(!boundary(g,c,dx,dz))continue;strands++;if(strands%2)continue;
const x=(c.ix+.5+dx*.44)*CELL,z=(c.iz+.5+dz*.44)*CELL,start=transformLift(g,x,z,true),d=lerp(6,30,(strands%7)/7)*lift;
ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.bezierCurveTo(start.x+5,start.y+d*.34,start.x-7,start.y+d*.81,start.x+Math.sin(strands)*8,start.y+d);ctx.stroke()}}
ctx.restore();
for(const c of ordered){const top=cellCorners(c,(x,z)=>transformLift(g,x,z,false));polygon(top,c.level>=3?'#91785a':'#a18c68',null);const mid=transformLift(g,(c.ix+.5)*CELL,(c.iz+.5)*CELL);ctx.strokeStyle='#705b43aa';ctx.lineWidth=.65;ctx.beginPath();ctx.moveTo(mid.x-5,mid.y);ctx.quadraticCurveTo(mid.x+2,mid.y-3,mid.x+7,mid.y+1);ctx.stroke()}
for(const p of g.members){const foot=transformLift(g,p.x,p.z);plantAt(p,foot)}
ctx.restore();
}
function drawHandRing(){if(!pointer||pointer.type!=='hand')return;const p=pointer.weed,q=project(p.x,p.z);ctx.save();ctx.strokeStyle=p.loose<p.need?'#d99a689f':'#fcf3bcbd';ctx.lineWidth=2;ctx.setLineDash([4,5]);ctx.beginPath();ctx.ellipse(q.x,q.y,20,8,0,0,R);ctx.stroke();ctx.restore()}
function drawShovels(){for(const s of shovels){const fade=1-s.age/.28;if(fade<=0)continue;ctx.save();ctx.globalAlpha=fade;ctx.translate(s.x+8,s.y-22-(1-fade)*11);ctx.rotate(.30-fade*.26);ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#6a4d37';ctx.beginPath();ctx.moveTo(0,-45);ctx.lineTo(0,-8);ctx.stroke();ctx.fillStyle='#78877f';ctx.beginPath();ctx.moveTo(-9,-8);ctx.lineTo(9,-8);ctx.lineTo(8,6);ctx.quadraticCurveTo(0,18,-8,6);ctx.closePath();ctx.fill();ctx.strokeStyle='#566b60';ctx.lineWidth=2;ctx.stroke();ctx.restore()}}
function effects(dt){
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age+=dt;p.vy+=p.gravity*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.age>=p.life){particles.splice(i,1);continue}ctx.globalAlpha=1-p.age/p.life;oval(p.x,p.y,p.size*(1-p.age/p.life*.45),p.size*.72,p.color)}ctx.globalAlpha=1;
for(let i=rings.length-1;i>=0;i--){const a=rings[i];a.age+=dt;if(a.age>.5){rings.splice(i,1);continue}const t=a.age/.5;ctx.strokeStyle='rgba(245,222,171,'+((1-t)*.6)+')';ctx.lineWidth=3*(1-t);ctx.beginPath();ctx.ellipse(a.x,a.y,7+a.r*t,3+a.r*t*.46,0,0,R);ctx.stroke()}
for(let i=shovels.length-1;i>=0;i--){const a=shovels[i];a.age+=dt;if(a.age>.28)shovels.splice(i,1)}drawShovels();
}
function finalize(g){
for(const c of g.cells){c.status='gone';c.group=null}
for(const p of g.members){p.state='gone';removed++}
UI.done.textContent=String(removed);
const pt=project(g.cx,g.cz);ring(pt.x,pt.y,Math.min(145,30+g.cells.length*2));emit(pt.x,pt.y,17,'#ccb58b',1.2);pop(1.4);buzz([17,36,21]);
if(g.members.length>1)toast('一次拔走 '+g.members.length+' 株！',1550);
if(removed>=total)finishAt=performance.now()+1650;
}
function frame(now){
const dt=Math.min(.05,(now-last||16)/1000);last=now;time+=dt;
for(let i=groups.length-1;i>=0;i--){const g=groups[i];g.age+=dt;if(g.age>=g.duration){finalize(g);groups.splice(i,1)}}
for(const p of plants){if(p.state==='live'&&p.tug>.001&&(!pointer||pointer.weed!==p))p.tug=Math.max(0,p.tug-dt*.8)}
if(toastUntil&&now>toastUntil){UI.toast.classList.remove('show');toastUntil=0}
if(finishAt&&now>finishAt){finishAt=0;UI.report.textContent='拔掉 '+removed+' 叢。班長：土都翻好了，隔壁也順便。';UI.finish.classList.add('show')}
drawBackground();drawSurface();
for(const p of plants)if(p.state==='live')groundPlant(p);
for(const g of groups)drawLift(g);
drawHandRing();effects(dt);
requestAnimationFrame(frame);
}
newGarden();requestAnimationFrame(frame);
})();
</script>
