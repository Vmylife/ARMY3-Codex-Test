<title>拔草模擬器｜60秒拔草挑戰 v0.6.5</title>
<style>
:root{color-scheme:light;--green:#263f31;--muted:#6e806e;--light:#f8faf4;--edge:#d7e0d0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden;background:#e6eddd;color:var(--green);font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

button{border:1px solid #d4decf;background:#fcfff6ed;color:#47634b;border-radius:13px;min-height:43px;padding:0 11px;box-shadow:0 5px 14px #4d63421b;font:750 12px system-ui,-apple-system,"PingFang TC",sans-serif;touch-action:manipulation;cursor:pointer}

#modeGuide{position:fixed;bottom:calc(182px + env(safe-area-inset-bottom));right:13px;background:#fbfff3e0;padding:5px 9px;border:1px solid #d9e5ce;border-radius:10px;font-size:11px;color:#4c644b;pointer-events:none}
#head .counter{margin-left:8px}
@media(max-height:640px){#tools{bottom:calc(64px + env(safe-area-inset-bottom))}#tools button{width:55px;height:55px}#modeGuide{bottom:calc(126px + env(safe-area-inset-bottom))}}

#challengebar{position:fixed;top:calc(93px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#fcfff3e8;border:1px solid #fff;border-radius:15px;padding:7px 13px;box-shadow:0 4px 13px #52644f17;font-size:12px;font-weight:800;z-index:2;white-space:nowrap}
.timevalue{display:flex;align-items:baseline;gap:3px;color:#36533e}.timevalue b{font-size:23px;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}.timevalue span{font-size:11px}
#challengebar.urgent{border-color:#dfb39d;background:#fff1e6ef}.urgent .timevalue{color:#b64d38}
#bossStats{position:fixed;top:calc(145px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;background:#fdf9e7ed;border:1px solid #f5e5ba;border-radius:13px;padding:8px 16px;min-width:146px;z-index:2;white-space:nowrap}
#bossStats[hidden]{display:none!important}#bossStats b{font-size:27px;font-variant-numeric:tabular-nums;color:#84633b}#bossStats span{font-size:11px;color:#a58c60}#rootReadout{display:block;font-size:16px;color:#77552f;font-variant-numeric:tabular-nums;margin-top:3px}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#253d2f91;backdrop-filter:blur(5px);z-index:10}
.modal.hidden{display:none}.card .big{font-size:40px}.card p{margin:12px 0 14px}
#finish{z-index:12}
#tools.hidden,#modeGuide.hidden{display:none!important}
@media(max-height:640px){#challengebar{top:calc(56px + env(safe-area-inset-top));padding:3px 9px}.timevalue b{font-size:19px}#bossStats{top:calc(103px + env(safe-area-inset-top))}}
@media(max-width:390px){#challengebar{top:calc(98px + env(safe-area-inset-top))}#bossStats{top:calc(151px + env(safe-area-inset-top))}}
#challengebar{position:fixed}#timeBonus{font-weight:900;color:#2e8744;opacity:0;transform:translateY(4px) scale(.8);transition:opacity .16s,transform .16s;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14px}#timeBonus.show{opacity:1;transform:translateY(0) scale(1)}

#bossMeter{position:fixed;top:28%;left:50%;width:max-content;max-width:95vw;transform:translate(-50%,-50%);pointer-events:none;z-index:6;text-align:center;filter:drop-shadow(0 6px 13px #32281840)}
#bossMeter[hidden]{display:none!important}
#bossMeter .meterCaption{font-size:13px;letter-spacing:.18em;font-weight:950;color:#fff9db;text-shadow:0 2px 6px #503f2c,0 0 10px #77552d;white-space:nowrap}
.meterNumbers{display:flex;align-items:baseline;justify-content:center;gap:4px;line-height:1;margin-top:5px;transform-origin:center bottom;will-change:transform}
.meterNumbers strong{font-size:clamp(71px,19vw,124px);font-weight:1000;line-height:1;letter-spacing:-.07em;font-variant-numeric:tabular-nums;color:#fff7bd;-webkit-text-stroke:2px #84562c;text-shadow:0 3px 0 #b87d37,0 7px 0 #6a472b,0 11px 22px #302517bf}
.meterNumbers span{font-weight:950;font-size:25px;color:#fff0be;-webkit-text-stroke:.65px #704b2b;text-shadow:0 3px 6px #483420}
.meterUnderline{margin:9px auto 0;width:70%;height:5px;border-radius:20px;background:linear-gradient(90deg,transparent,#fff7c4,transparent);box-shadow:0 0 17px #f8d96ca8}
#bossStats.charging{background:#fff0c9f5;border:2px solid #edc87a;box-shadow:0 3px 19px #b67b365e}
#bossStats.charging b{font-size:32px;color:#854319}
#bossStats.charging .meterTapCount{display:inline-block;transform-origin:center}
@media(max-height:640px){#bossMeter{top:29%}.meterNumbers strong{font-size:clamp(65px,16vh,110px)}}

/* Keep sound control at the top right, above the weed count, without blocking play. */
.headActions{display:flex;flex-direction:column;align-items:flex-end;gap:7px;pointer-events:auto;flex-shrink:0}
#head .headActions .counter{margin-left:0}
#sound{min-height:34px;padding:0 12px;font-size:12px;border-radius:12px;background:#fcfff6ef;box-shadow:0 4px 12px #52644f18}
@media(max-width:390px){.headActions{gap:5px}#sound{min-height:32px;padding:0 9px;font-size:11px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="2.5D 拔草遊戲，按住雜草往畫面上方拉"></canvas>
<div id="hud">
 <div id="head"><div><div class="eyebrow">ARMY / GARDEN · 2.5D</div><h1>拔草模擬器</h1><div class="note">挺立＝沒鬆 · 舒展＝剛好 · 枯黃＝鏟過頭</div></div><div class="headActions"><button id="sound" aria-label="音效開關">🔊 音效</button><div class="counter" id="plantCounter"><b id="done">0</b><small> / <span id="total">0</span> 叢</small></div></div></div>
 <div id="challengebar"><div id="stageText">第 1 / 3 片</div><div class="timevalue"><b id="seconds">60.0</b><span>秒</span></div><span id="timeBonus" aria-live="polite"></span></div>
 <div id="bossStats" hidden><b id="tapCount">0</b><span> 次蓄力</span><strong id="rootReadout"></strong></div>
 <div id="bossMeter" aria-live="off" hidden><div class="meterCaption">草根長度 · 正在爆衝</div><div class="meterNumbers"><strong id="bossMeters">0.0</strong><span>m</span></div><div class="meterUnderline"></div></div>
 <div id="footer"><div id="tip">先選鏟子挖土，想拔草再選「手」</div><div id="buttons"><button id="reset">重新挑戰</button></div></div>
 <div id="tools" role="group" aria-label="選擇操作工具">
 <button id="handTool" aria-label="切換成手拔草"><span class="toolIcon">✋</span><span>手</span></button>
 <button id="shovelTool" class="selected" aria-label="切換成鏟子鬆土"><svg class="toolIcon" viewBox="0 0 42 42" aria-hidden="true"><path d="M24 7L14 25" fill="none" stroke="currentColor" stroke-width="4.6" stroke-linecap="round"/><path d="M28.2 4.7l-4.4-2.4-6 10.6 4.4 2.3z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M13.6 24.6c-3.9 1.4-8.1 4.7-6.9 10.2l7.6 4.3c4.8-3.7 5.6-8.6 4.5-12.3z" fill="currentColor" opacity=".91"/></svg><span>鏟子</span></button>
 </div>
 </div>
<div id="modeGuide">目前：鏟子</div><div id="message"></div><div id="help" class="show">先用鏟子挖鬆土壤，再切換手拔草</div>
<div id="welcome" class="modal"><div class="card"><div class="big">🌱</div><h2>60 秒拔草挑戰</h2><p>共有三片草地，完成一片自動換下一片。<br>全部清完會出現大草王！<br>剩下的時間瘋狂點擊蓄力，倒數結束後往上拉，看看草根到底有多長。</p><button id="start" class="primary">開始挑戰</button></div></div>
<div id="finish"><div class="card"><div class="big">🌱</div><h2 id="finishTitle">斬草除根。</h2><p id="report">班長說：旁邊還有一片。</p><button id="again" class="primary">再挑戰一次</button></div></div>
<div class="version">獨立試玩 · v0.6.5</div>
<script>


(function(){
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});
const UI={done:document.getElementById('done'),total:document.getElementById('total'),tip:document.getElementById('tip'),toast:document.getElementById('message'),help:document.getElementById('help'),finish:document.getElementById('finish'),report:document.getElementById('report'),guide:document.getElementById('modeGuide'),hand:document.getElementById('handTool'),shovel:document.getElementById('shovelTool')};
const R=Math.PI*2,DURATION_MS=60000,MAPS=3;
const stageUI={welcome:document.getElementById('welcome'),start:document.getElementById('start'),
timer:document.getElementById('seconds'),timeBonus:document.getElementById('timeBonus'),stage:document.getElementById('stageText'),
challenge:document.getElementById('challengebar'),bossStats:document.getElementById('bossStats'),
tapCount:document.getElementById('tapCount'),rootReadout:document.getElementById('rootReadout'),bossMeter:document.getElementById('bossMeter'),bossMeters:document.getElementById('bossMeters'),
finishTitle:document.getElementById('finishTitle'),counter:document.getElementById('plantCounter'),
tools:document.getElementById('tools'),reset:document.getElementById('reset')};
let W=0,H=0,DPR=1,S=38,SX=38,SZ=38,baseY=450,time=0,last=0,tool='shovel',plants=[],soilMarks=[],holes=[],groups=[],particles=[],rings=[],shovels=[],strokeSerial=0,lastDigDustAt=-1000,lastDigSoundAt=-1000;
let pointer=null,total=0,removed=0,brokenTotal=0,toastUntil=0,finishAt=0,audioCtx=null,noise=null,mute=false,seed=Math.random()*999;
let runPhase='intro',mapNumber=1,deadline=0,remainingMs=DURATION_MS,completedMaps=0,totalWeedsCleared=0,allBreaks=0,bonusDisplayUntil=0;
let boss={taps:0,pulse:0,extractionTime:0,rootNow:0,rootGoal:0,rootDuration:0,lastSoundAt:0,hitShake:0,hitSparks:[]};
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function smooth(x){x=clamp(x,0,1);return x*x*(3-2*x)}
function key(ix,iz){return ix+','+iz}
function coord(x,z){return{ix:Math.floor(x/CELL),iz:Math.floor(z/CELL)}}
function inside(x,z){return x*x/(4.78*4.78)+z*z/(4.39*4.39)<.97}
// Independent perspective axes fill the available screen instead of letterboxing a tiny patch.
function project(x,z,y=0){const k=1-z*.021;return{x:W*.5+x*SX*k,y:baseY+z*SZ-x*S*.08-y*S*.98}}
function unproject(px,py){
 let z=(py-baseY)/SZ,x=0;
 for(let i=0;i<5;i++){x=(px-W*.5)/(SX*(1-z*.021));z=(py-baseY+x*S*.08)/SZ}
 return{x,z};
}
function resize(){
 W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 S=Math.min(96,W/7.4,H/8.1);  // Large, finger-friendly individual grass
 SX=W/8.85;                  // Wide terrain reaches beyond the left/right edges
 SZ=H*.075;                 // Stronger depth perspective fills the vertical space
 baseY=H*.545;
}
addEventListener('resize',resize,{passive:true});resize();
function enableSound(){if(mute)return;try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();noise=audioCtx.createBuffer(1,Math.round(audioCtx.sampleRate*.26),audioCtx.sampleRate);const p=noise.getChannelData(0);for(let i=0;i<p.length;i++)p[i]=Math.random()*2-1}if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function noiseSound(volume,freq,dur){if(!audioCtx||mute||!noise)return;try{const now=audioCtx.currentTime,s=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();s.buffer=noise;f.type='bandpass';f.frequency.value=freq;f.Q.value=.6;g.gain.setValueAtTime(Math.max(.0001,volume),now);g.gain.exponentialRampToValueAtTime(.0001,now+dur);s.connect(f);f.connect(g);g.connect(audioCtx.destination);s.start(now);s.stop(now+dur)}catch(e){}}
function pop(vol=.75){if(!audioCtx||mute)return;try{const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(rand(245,310),now);o.frequency.exponentialRampToValueAtTime(rand(80,110),now+.115);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.18*vol,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+.13);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.14);noiseSound(.055*vol,950,.083)}catch(e){}}
function digSound(){noiseSound(.075,430,.16);if(audioCtx&&!mute)try{const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.setValueAtTime(108,now);o.frequency.exponentialRampToValueAtTime(61,now+.09);g.gain.setValueAtTime(.05,now);g.gain.exponentialRampToValueAtTime(.0001,now+.11);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.12)}catch(e){}}
function buzz(v){try{if(navigator.vibrate)navigator.vibrate(v)}catch(e){}}
function toast(text,ms=1350){UI.toast.textContent=text;UI.toast.classList.add('show');toastUntil=performance.now()+ms}
function makePlant(x,z,type){return{x,z,type,need:(r=>r<.60?1:r<.90?2:3)(Math.random()),loose:0,state:'live',broken:false,recoveryDig:0,breakCause:'',height:rand(.72,1.19),seed:rand(0,999),leaves:Math.floor(rand(5,9)),tug:0,lastStroke:-1}}
function grassCondition(p){
 if(p.broken)return p.recoveryDig>=2&&p.loose>=p.need?'stump-ready':'stump';
 if(p.loose<p.need)return 'tight';
 if(p.loose===p.need)return 'ready';
 return 'rotten';
}
function canPull(p){const s=grassCondition(p);return s==='ready'||s==='stump-ready'}
function loadPatch(index){
  plants=[];soilMarks=[];holes=[];groups=[];particles=[];rings=[];shovels=[];
  lastDigDustAt=-1000;lastDigSoundAt=-1000;removed=0;brokenTotal=0;total=0;
  pointer=null;finishAt=0;seed=Math.random()*900;
  UI.help.classList.remove('show');
  const count=7+(index-1)*2;
  let attempts=0;
  while(plants.length<count&&attempts++<1600){
    const x=rand(-3.7,3.7),z=rand(-3.28,3.37);if(!inside(x,z))continue;
    let valid=true;
    for(const p of plants)if(Math.hypot((p.x-x)*1.04,(p.z-z)*.92)<.90){valid=false;break}
    if(valid)plants.push(makePlant(x,z,Math.random()<.25?'tough':'normal'));
  }
  total=plants.length;
  plants.sort((a,b)=>a.z-b.z);
  UI.done.textContent='0';UI.total.textContent=String(total);
  stageUI.stage.textContent='第 '+index+' / '+MAPS+' 片';
  setTool('shovel');
  UI.tip.textContent='清空這片草地，就會自動前往下一片！';
}
function startGame(){
  enableSound();
  mapNumber=1;completedMaps=0;totalWeedsCleared=0;allBreaks=0;runPhase='field';
  remainingMs=DURATION_MS;deadline=performance.now()+DURATION_MS;
  boss={taps:0,pulse:0,extractionTime:0,rootNow:0,rootGoal:0,rootDuration:0,lastSoundAt:0,hitShake:0,hitSparks:[]};
  bonusDisplayUntil=0;stageUI.timeBonus.classList.remove('show');stageUI.timeBonus.textContent='';
  stageUI.welcome.classList.add('hidden');UI.finish.classList.remove('show');
  stageUI.counter.style.display='';stageUI.tools.classList.remove('hidden');
  UI.guide.classList.remove('hidden');stageUI.reset.style.display='';
  stageUI.bossStats.hidden=true;stageUI.bossStats.classList.remove('charging');stageUI.bossMeter.hidden=true;stageUI.bossMeters.textContent='0.0';stageUI.challenge.classList.remove('urgent');
  stageUI.timer.textContent='60.0';loadPatch(1);
}
function enterBoss(){
 runPhase='bossCharge';plants=[];soilMarks=[];holes=[];groups=[];particles=[];rings=[];shovels=[];
 pointer=null;stageUI.tools.classList.add('hidden');UI.guide.classList.add('hidden');
 stageUI.reset.style.display='none';stageUI.counter.style.display='none';
 stageUI.bossStats.hidden=false;stageUI.bossStats.classList.add('charging');stageUI.bossMeter.hidden=true;stageUI.stage.textContent='最終 BOSS';
 stageUI.tapCount.textContent='0';stageUI.rootReadout.textContent=''; 
 UI.tip.textContent='剩餘時間瘋狂點螢幕！每點一下草根就更長！';
 toast('大草王出現！快點擊蓄力！',1450);
}
function timerExpired(){
 remainingMs=0;stageUI.timer.textContent='0.0';
 if(runPhase==='bossCharge'){
   runPhase='bossPull';boss.rootGoal=Math.round((1.8+boss.taps*.43)*10)/10;
   boss.rootDuration=clamp(2.3+boss.taps*.026,2.3,9.3);

 ctx.restore();
}
function groundPlant(p){
 const pos=project(p.x,p.z,p.tug*.22);oval(pos.x,pos.y+2,12,4,'#3f4c3370');
 if(p.tug>.01){ctx.strokeStyle='#dcc29a';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(pos.x,pos.y+14);ctx.quadraticCurveTo(pos.x+9,pos.y+4,pos.x,pos.y-7);ctx.stroke()}
 plantAt(p,pos);
}
function drawRoots(p,origin,travel,progress){
  // Root emerges in a long flexible strand while the hole stays fixed in the soil.
  const rise=travel,seed=p.seed,wiggle=Math.sin(time*12+seed)*progress*2.7;
  const n=32,coords=[];
  for(let i=0;i<=n;i++){
    const t=i/n,osc=Math.sin(t*12.5+seed+time*3)*t*(4+progress*6);
    coords.push({x:origin.x+osc+wiggle*t,y:origin.y-rise*t+Math.sin(t*Math.PI*2.3+seed)*progress*2});
  }
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#68503b';ctx.lineWidth=8;ctx.beginPath();
  for(let i=0;i<coords.length;i++){const q=coords[i];if(i)ctx.lineTo(q.x,q.y);else ctx.moveTo(q.x,q.y)}ctx.stroke();
  ctx.strokeStyle='#d9be93';ctx.lineWidth=5.4;ctx.stroke();
  ctx.strokeStyle='#f1ddaf';ctx.lineWidth=1.3;ctx.stroke();
  for(let i=3;i<n-2;i+=4){
    const a=coords[i],b=coords[i+1],dir=i%3?1:-1;
    ctx.strokeStyle=i%2?'#e0cba7':'#b99e73';ctx.lineWidth=1.45;
    const length=(7+(i%4)*2)*progress;
    ctx.beginPath();ctx.moveTo(a.x,a.y);
    ctx.quadraticCurveTo(a.x+dir*length*.52,a.y+6,a.x+dir*length,a.y+8+(i%3)*3);
    ctx.stroke();
    if(i%8===3){oval(a.x+dir*length,a.y+11,2.2,1.6,'#aa855e')}
  }
  ctx.restore();
  return coords[n];
}
function drawExtraction(g){
 for(let i=0;i<g.members.length;i++){
   const p=g.members[i],elapsed=g.age-i*g.delay,origin=project(p.x,p.z),result=g.results.get(p);
   if(elapsed<=0){groundPlant(p);continue}
   if(result==='snap'){
     const snapped=elapsed>.32;
     const s=smooth(elapsed/.32);
     if(!snapped){
      plantAt(p,{x:origin.x+Math.sin(time*35+i)*s*5,y:origin.y-Math.sin(s*Math.PI)*4});
     }else{
      plantAt(p,origin);
      const fade=1-smooth((elapsed-.44)/.55);
      if(fade>0){
       ctx.save();ctx.globalAlpha=fade;
       const severed={...p,broken:false,loose:p.breakCause==='rotten'?p.need+1:0};
       const fly=clamp((elapsed-.32)/.72,0,1);
       plantAt(severed,{x:origin.x+9+fly*20,y:origin.y-22-fly*62},1);
       ctx.restore();
      }
     }
     continue;
   }
   const q=clamp(elapsed/1.57,0,1),pressure=smooth(q/.19),released=smooth((q-.17)/.72);
   const height=S*(.13*pressure+2.35*released),fade=1-smooth((elapsed-1.43)/.64);
   if(fade<=.002)continue;
   ctx.save();ctx.globalAlpha=fade;
   oval(origin.x,origin.y,7+released*4,3+released*1.4,'#4d3b2e');
   ctx.strokeStyle='#cdb189';ctx.lineWidth=1.45;
   ctx.beginPath();ctx.ellipse(origin.x,origin.y,11+released*3,5+released*1.2,0,0,R);ctx.stroke();
   if(released>.006){
     const top=drawRoots(p,origin,height,released);
     plantAt(p,{x:top.x,y:top.y},1);
   }else plantAt(p,{x:origin.x+Math.sin(time*14+p.seed)*pressure*2,y:origin.y-pressure*S*.10},1);
   ctx.restore();
 }
}
function drawHandRing(){if(!pointer||pointer.type!=='hand')return;const p=pointer.weed,q=project(p.x,p.z);ctx.save();ctx.strokeStyle=p.loose<p.need?'#d99a689f':'#fcf3bcbd';ctx.lineWidth=2;ctx.setLineDash([4,5]);ctx.beginPath();ctx.ellipse(q.x,q.y,20,8,0,0,R);ctx.stroke();ctx.restore()}
function drawShovels(){for(const s of shovels){const fade=1-s.age/.28;if(fade<=0)continue;ctx.save();ctx.globalAlpha=fade;ctx.translate(s.x+8,s.y-22-(1-fade)*11);ctx.rotate(.30-fade*.26);ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#6a4d37';ctx.beginPath();ctx.moveTo(0,-45);ctx.lineTo(0,-8);ctx.stroke();ctx.fillStyle='#78877f';ctx.beginPath();ctx.moveTo(-9,-8);ctx.lineTo(9,-8);ctx.lineTo(8,6);ctx.quadraticCurveTo(0,18,-8,6);ctx.closePath();ctx.fill();ctx.strokeStyle='#566b60';ctx.lineWidth=2;ctx.stroke();ctx.restore()}}
function effects(dt){
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age+=dt;p.vy+=p.gravity*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.age>=p.life){particles.splice(i,1);continue}ctx.globalAlpha=1-p.age/p.life;oval(p.x,p.y,p.size*(1-p.age/p.life*.45),p.size*.72,p.color)}ctx.globalAlpha=1;
for(let i=rings.length-1;i>=0;i--){const a=rings[i];a.age+=dt;if(a.age>.5){rings.splice(i,1);continue}const t=a.age/.5;ctx.strokeStyle='rgba(245,222,171,'+((1-t)*.6)+')';ctx.lineWidth=3*(1-t);ctx.beginPath();ctx.ellipse(a.x,a.y,7+a.r*t,3+a.r*t*.46,0,0,R);ctx.stroke()}
for(let i=shovels.length-1;i>=0;i--){const a=shovels[i];a.age+=dt;if(a.age>.28)shovels.splice(i,1)}drawShovels();
}
function finalize(g){
let successful=0,perfect=0;
for(const p of g.members){
 if(g.results.get(p)==='extract'){
  if(!p.broken)perfect++; // Fully intact grass counts as perfect; recovered snapped roots never award time.
  p.state='gone';removed++;successful++;holes.push({x:p.x,z:p.z,size:p.broken?7.5:9});
 }else p.state='live';
}
UI.done.textContent=String(removed);
if(perfect>0&&runPhase==='field'){
  deadline+=perfect*500;
  remainingMs=Math.max(0,deadline-performance.now());
  stageUI.timer.textContent=(remainingMs/1000).toFixed(1);
  bonusDisplayUntil=performance.now()+1050;
  stageUI.timeBonus.textContent='+'+(perfect*.5).toFixed(1)+' 秒';
  stageUI.timeBonus.classList.add('show');
}
const at=project(g.cx,g.cz);ring(at.x,at.y,Math.min(95,25+successful*5));
emit(at.x,at.y,11,'#c9ae8a',.9);if(successful)pop(successful>1?1.03:.87);
if(successful>1)toast('完整拔出 '+successful+' 株！',1350);
if(removed>=total&&runPhase==='field'){
  runPhase='transition';
  finishAt=performance.now()+800;
  UI.tip.textContent=mapNumber<3?'這片清乾淨了！準備下一片！':'第三片也完成了！準備挑戰大草王！';
  if(mapNumber<=3)toast('第 '+mapNumber+' 片清除完成！',850);
}
}
function bossPlantAt(x,y,scale=1){
 ctx.save();
 const stems=12;
 for(let layer=0;layer<3;layer++){
  for(let i=0;i<stems;i++){
   const ang=(i-(stems-1)/2)*.245+layer*.06,len=S*(2.5+layer*.35)*(1+Math.sin(i*12.6)*.07)*scale;
   const sway=Math.sin(time*2+i*.4)*2+Math.sin(time*17+i*2)*boss.pulse*7;
   const dx=Math.sin(ang)*len+sway,dy=-Math.cos(ang)*len;
   leaf(x,y,dx,dy,Math.max(9,15*scale),i%4===0?'#376f3e':i%3===0?'#48894a':i%2===0?'#74a656':'#82b469');
  }
 }
 ctx.restore();
}
function drawBossRoot(){
 // The boss leaf crown is pulled directly upward and exits the top of the screen.
 // The root stays at the hole while its highlights and feeder roots STREAM upward.
 const origin=project(0,.50),sec=boss.extractionTime;
 const speed=clamp(H*.65+boss.taps*15,430,1800);
 const lifted=sec*speed;
 const headY=origin.y-lifted;
 const streamTop=Math.max(-80,headY);
 const visibleLength=origin.y-streamTop;
 if(visibleLength<3){bossPlantAt(origin.x,origin.y,1);return}
 const wavyX=y=>origin.x+Math.sin(y*.024+sec*16)*3+Math.sin(y*.053-sec*8)*2;
 ctx.save();
 ctx.lineCap='round';ctx.lineJoin='round';
 const n=Math.max(2,Math.ceil(visibleLength/8));
 ctx.beginPath();
 for(let i=0;i<=n;i++){
  const y=origin.y-visibleLength*i/n,x=wavyX(y);
  if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);
 }
 // Central heavy root with two lighter moving highlights.
 ctx.shadowColor='#4e3c2b88';ctx.shadowBlur=8;ctx.shadowOffsetX=3;
 ctx.strokeStyle='#563a2a';ctx.lineWidth=34;ctx.stroke();
 ctx.shadowBlur=0;ctx.shadowOffsetX=0;
 ctx.strokeStyle='#cda879';ctx.lineWidth=27;ctx.stroke();
 ctx.strokeStyle='#f6deb4';ctx.lineWidth=6;
 const travel=sec*clamp(430+boss.taps*20,480,1900);
 ctx.setLineDash([37,22]);ctx.lineDashOffset=-travel;
 ctx.stroke();ctx.setLineDash([]);
 // Secondary fibrous texture scrolls upward. The whole strand never curls or loops.
 const gap=26,phase=travel%gap;
 for(let j=0;j<Math.ceil(visibleLength/gap)+2;j++){
  const dist=j*gap+phase;if(dist<4||dist>=visibleLength-4)continue;
  const y=origin.y-dist,x=wavyX(y),dir=j%2?1:-1,twig=14+(j%4)*4;
  ctx.strokeStyle=j%3?'#e6c598':'#a98860';ctx.lineWidth=1.7;
  ctx.beginPath();ctx.moveTo(x,y);
  ctx.quadraticCurveTo(x+dir*twig*.76,y+3,x+dir*twig,y+8+(j%3)*3);ctx.stroke();
 }
 // Continuous upward motion streaks make the visible root feel like it is being expelled.
 for(let i=0;i<6;i++){
  const d=(travel*.82+i*97)%(visibleLength+48);
  const y=origin.y-d;if(y<streamTop||y>origin.y)continue;
  ctx.strokeStyle=i%2?'#fff2d099':'#9b754b77';ctx.lineWidth=i%2?1.7:2.2;
  ctx.beginPath();ctx.moveTo(wavyX(y)+(i%2?5:-5),y);
  ctx.lineTo(wavyX(y-17)+(i%2?5:-5),y-17);ctx.stroke();
 }
 ctx.restore();
 // Big crown exits entirely; the root continues erupting for the remaining duration.
 if(headY>-S*3.5)bossPlantAt(wavyX(headY),headY,.92);
}
function drawBossHitSparks(){
 for(const spark of boss.hitSparks){
  const t=clamp(spark.age/spark.life,0,1),o=1-t;
  ctx.save();ctx.translate(spark.x,spark.y-t*52);
  ctx.rotate(spark.angle*.10);ctx.globalAlpha=o;
  const radius=22+t*26;
  ctx.strokeStyle='#fff0aa';ctx.lineWidth=3.7*o;
  ctx.beginPath();ctx.arc(0,0,radius,0,R);ctx.stroke();
  // Each tap gets its own burst, including taps occurring between consecutive frames.
  for(let j=0;j<7;j++){
   const a=j*R/7+spark.angle,inner=13+t*21,outer=inner+15*o;
   ctx.beginPath();ctx.moveTo(Math.cos(a)*inner,Math.sin(a)*inner);
   ctx.lineTo(Math.cos(a)*outer,Math.sin(a)*outer);
   ctx.stroke();
  }
  ctx.font='900 '+Math.round(25+15*o)+'px system-ui';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=3.5;ctx.strokeStyle='#754829';ctx.strokeText('+'+1,0,-9);
  ctx.fillStyle='#fff5c6';ctx.fillText('+1',0,-9);
  ctx.restore();
 }
 ctx.globalAlpha=1;
}
function drawBoss(){
 const origin=project(0,.50);
 ctx.save();
 const hit=runPhase==='bossCharge'?boss.hitShake:0;
 ctx.translate(origin.x,origin.y);
 if(hit>.01){
  const wave=Math.sin(time*48+boss.taps*1.31);
  ctx.translate((boss.taps%2?1:-1)*hit*(8+Math.abs(wave)*5),hit*(3+wave*2));
  ctx.scale(1+hit*.075,1-hit*.10);
 }
 ctx.translate(-origin.x,-origin.y);
 oval(origin.x,origin.y,43,17,'#65533898');
 ctx.strokeStyle='#d7bd91';ctx.lineWidth=2.5;
 ctx.beginPath();ctx.ellipse(origin.x,origin.y,44,18,0,0,R);ctx.stroke();
 if(runPhase==='bossExtract')drawBossRoot();
 else if(runPhase==='bossCharge'){
  const swell=1+Math.min(.17,boss.taps*.002)+boss.pulse*.09;
  bossPlantAt(origin.x,origin.y,swell);
  if(boss.pulse>.05){
   ctx.strokeStyle='rgba(251,225,139,'+boss.pulse*.72+')';
   ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(origin.x,origin.y,49+boss.pulse*45,20+boss.pulse*16,0,0,R);ctx.stroke();
  }
 }else if(runPhase==='bossPull')bossPlantAt(origin.x,origin.y,1.1);
 ctx.restore();
 if(runPhase==='bossCharge')drawBossHitSparks();
}
function frame(now){
const dt=Math.min(.05,(now-last||16)/1000);last=now;time+=dt;
if(runPhase==='field'||runPhase==='transition'||runPhase==='bossCharge'){
 remainingMs=Math.max(0,deadline-now);
 stageUI.timer.textContent=(remainingMs/1000).toFixed(1);
 stageUI.challenge.classList.toggle('urgent',remainingMs<=10000);
 if(remainingMs<=0)timerExpired();
}
if(runPhase==='field'||runPhase==='transition'){
 for(let i=groups.length-1;i>=0;i--){
  const g=groups[i];g.age+=dt;
  for(let j=0;j<g.members.length;j++){
   const p=g.members[j],threshold=j*g.delay+.43;
   if(g.age>=threshold&&!g.fired.has(p)){
     g.fired.add(p);
     if(g.results.get(p)==='snap')markBroken(p,p.loose>p.need?'rotten':'tight',false);
     else{pop(.58+rand(0,.22));noiseSound(.046,620,.075);
       const at=project(p.x,p.z);emit(at.x,at.y,11,'#c8a67e',.98);
       ring(at.x,at.y,19);if(j%3===0)buzz(8)}
   }
  }
  if(g.age>=g.duration){finalize(g);groups.splice(i,1)}
 }
 if(runPhase==='transition'&&finishAt&&now>=finishAt&&groups.length===0){
  finishAt=0;completedMaps++;totalWeedsCleared+=removed;allBreaks+=brokenTotal;
  if(mapNumber<MAPS){mapNumber++;runPhase='field';loadPatch(mapNumber)}
  else enterBoss();
 }
}
if(runPhase==='bossCharge'){
 boss.pulse=Math.max(0,boss.pulse-dt*6.5);
 boss.hitShake=Math.max(0,boss.hitShake-dt*9.0);
 for(let i=boss.hitSparks.length-1;i>=0;i--){
  const s=boss.hitSparks[i];s.age+=dt;
  if(s.age>=s.life)boss.hitSparks.splice(i,1);
 }
}
if(runPhase==='bossExtract'){
 boss.extractionTime+=dt;
 const fraction=clamp(boss.extractionTime/boss.rootDuration,0,1);
 // Fast accelerating number reveal. No maximum is shown until the result.
 const shown=Math.pow(fraction,.78);
 boss.rootNow=boss.rootGoal*shown;
 stageUI.bossMeters.textContent=boss.rootNow.toFixed(1);
 stageUI.bossMeter.querySelector('.meterNumbers').style.transform='scale('+(1+.035*Math.sin(boss.extractionTime*53)+.022*Math.sin(boss.extractionTime*17))+')';
 if(boss.extractionTime-boss.lastSoundAt>.092){
   boss.lastSoundAt=boss.extractionTime;
   if(boss.extractionTime<boss.rootDuration){pop(.20+rand(0,.17));noiseSound(.06,780,.06);const at=project(0,.50);emit(at.x,at.y,5,'#d0ad82',.76)}
 }
 if(boss.extractionTime>=boss.rootDuration){boss.rootNow=boss.rootGoal;stageUI.bossMeters.textContent=boss.rootGoal.toFixed(1);showResults(true)}
}
for(const p of plants)if(p.state==='live'&&p.tug>.001&&(!pointer||pointer.weed!==p))p.tug=Math.max(0,p.tug-dt*.8);
if(toastUntil&&now>toastUntil){UI.toast.classList.remove('show');toastUntil=0}
if(bonusDisplayUntil&&now>=bonusDisplayUntil){stageUI.timeBonus.classList.remove('show');bonusDisplayUntil=0}
drawBackground();drawSurface();
if(runPhase==='bossCharge'||runPhase==='bossPull'||runPhase==='bossExtract'||(runPhase==='result'&&completedMaps===3))drawBoss();
else{
 for(const p of plants)if(p.state==='live')groundPlant(p);
 for(const g of groups)drawExtraction(g);
 drawHandRing();
}
effects(dt);requestAnimationFrame(frame);
}

loadPatch(1);stageUI.welcome.classList.remove('hidden');requestAnimationFrame(frame);
})();

</script>
