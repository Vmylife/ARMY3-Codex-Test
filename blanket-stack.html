<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#173228">
<title>國軍模擬器｜棉被疊疊樂</title>
<style>
/* Army UI: never show iOS long-press selection / blue text highlight. */
html,body,body *,button,span,label,canvas{
 -webkit-user-select:none!important;user-select:none!important;
 -webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent!important;
}
::selection{background:transparent!important;color:inherit!important}
::-moz-selection{background:transparent!important;color:inherit!important}

[hidden]{display:none!important}
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#f6f1d9;background:#162b22}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;pointer-events:none}
#field{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:linear-gradient(#9abed0 8%,#c0d0b0 70%,#a7c4a1)}
#hud{position:fixed;z-index:5;top:calc(env(safe-area-inset-top) + 14px);left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
.pill{background:#122a21e8;border:1px solid #e5d49b72;border-radius:14px;padding:10px 14px;box-shadow:0 5px 18px #101e1466;white-space:nowrap;font-weight:850;font-size:15px;color:#f6edc7}
.pill.danger{border-color:#f5a25a;box-shadow:0 0 17px #e6794c80;animation:pulseDanger .8s infinite alternate}@keyframes pulseDanger{to{border-color:#f4d784;box-shadow:0 0 4px #d98a4970}}
#layers{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.3px}.pill small{font-size:12px;color:#c8c9b1;font-weight:700}
#actions{position:fixed;z-index:6;right:14px;bottom:calc(env(safe-area-inset-bottom) + 16px);pointer-events:none}
#cleanup{pointer-events:auto;min-width:112px;min-height:48px;padding:0 14px;border:1px solid #d7d5b27a;border-radius:12px;background:#203c30eF;color:#f2eccf;font-size:14px;font-weight:800;box-shadow:0 4px 12px #15261966}
#cleanup:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 8px #15261980}
#cleanup.confirming{background:#e9d39a;color:#27372a;border-color:#f4e4b4}
#tapGuide{position:fixed;z-index:5;left:14px;bottom:calc(env(safe-area-inset-bottom) + 25px);padding:7px 10px;border-radius:9px;background:#1a392ce8;color:#f6e7bd;font-size:13px;font-weight:850;white-space:nowrap;pointer-events:none}
#message{position:fixed;top:calc(env(safe-area-inset-top) + 85px);left:50%;transform:translateX(-50%);text-align:center;z-index:5;font-size:21px;font-weight:900;text-shadow:0 3px 9px #183222de;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .22s}#message.show{opacity:1}
#message.perfect{color:#fff0b9;text-shadow:0 2px 0 #664c28,0 4px 12px #183222;letter-spacing:.04em}
#overlay{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;padding:20px;background:#0d2016aa;backdrop-filter:blur(4px)}#overlay[hidden]{display:none}
.panel{width:min(400px,100%);max-height:90vh;overflow:auto;border-radius:22px;background:#f3f1e4;color:#1d392d;padding:25px 24px 23px;text-align:center;box-shadow:0 17px 60px #02100daa}
.panel h1{font-size:30px;line-height:1.2;margin:8px 0 22px;font-weight:950}.panel .big{font-size:48px;font-weight:950;line-height:1.2;margin:10px 0}.panel p{font-size:15px;margin:8px 0 20px;color:#496154}.panel button{width:100%;padding:15px 12px;min-height:52px;border:0;border-radius:14px;font-size:18px;font-weight:900;background:#305b48;color:#fff6db}.panel button.secondary{background:#d9ddca;color:#315344;margin-top:10px}
#scores{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}#scores div{border:1px solid #c1ceba;border-radius:11px;padding:12px 4px;font-weight:950;font-size:23px}#scores small{display:block;margin-bottom:5px;font-weight:750;font-size:12px;color:#617466}
#loadLine{display:block;height:5px;border-radius:99px;background:#d8e0d5;margin:17px 0;overflow:hidden}#loadBar{display:block;background:#678c61;height:100%;width:0;transition:width .2s}
#boomFlash{position:fixed;z-index:4;pointer-events:none;width:240px;height:240px;border-radius:50%;opacity:0;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff6bc 0%,#ffd74f 13%,#f47b23 34%,#bb3f154d 52%,transparent 73%);filter:blur(6px)}
#fatal{position:fixed;z-index:30;inset:0;background:#173027;color:#fffbe7;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px}#fatal[hidden]{display:none}#fatal div{max-width:430px}#fatal button{margin-top:18px;background:#e8d18a;color:#243d2b;border:0;border-radius:12px;padding:15px 30px;font-weight:900}
@media(max-width:390px){#hud{left:8px;right:8px}.pill{font-size:13px;padding:10px 10px}#layers{font-size:23px}}
</style>
</head>
<body>
<canvas id="field" aria-label="3D 操場棉被疊疊樂"></canvas>
<div id="boomFlash"></div>
<div id="hud" hidden><div class="pill">第 <span id="round">1</span> / 3 輪</div><div class="pill"><span id="layers">1</span> <small>層</small></div><div class="pill">收拾 <span id="left">3</span> 次</div></div>
<div id="message" aria-live="polite"></div>
<div id="tapGuide" role="status" hidden>點一下畫面，放下棉被</div>
<div id="actions" hidden><button id="cleanup" type="button" aria-label="結束本輪並收拾棉被">結束本輪</button></div>
<div id="overlay"><div class="panel" id="modal"><h1>🛏️ 棉被疊疊樂</h1><p id="loadingText">正在載入操場…</p><span id="loadLine"><span id="loadBar"></span></span><button id="play" disabled>準備中…</button></div></div>
<div id="fatal" hidden><div><h2>無法載入棉被疊疊樂</h2><p id="reason"></p><button id="reload">重新載入</button></div></div>
<!-- ARMY3 v1.55 / One-motion airborne supine landing fix. Only this HTML needs replacing. -->
<script type="module" src="./src/systems/blanketSfx.js?v=173"></script>
<script type="module" src="./src/systems/blanketAchievements.js?v=324"></script>
<script type="module">
try {
  // Apply a single continuous supine knockback from the first hit frame. Other game logic stays v1.53.
  const response = await fetch('./blanket-stack.js?v=156', {cache:'default'});
  if(!response.ok) throw new Error('棉被主程式下載失敗：HTTP '+response.status);
  let source = await response.text();

  const replaceOnce = (find, replacement, name) => {
    const index = source.indexOf(find);
    if(index < 0 || source.indexOf(find,index+find.length)>=0) {
      throw new Error('棉被修正與目前的遊戲版本不相容：'+name);
    }
    source = source.slice(0,index)+replacement+source.slice(index+find.length);
  };

  // Keep the body centered where the soldier fell while rotating it onto its back.
  replaceOnce(
    'let m=mul(T(o.x+(o.swayX||0),o.y??o.sourceY??0,o.z+(o.swayZ||0)),ry((o.rot||0)*Math.PI/180));',
    `const faceYaw=(o.rot||0)*Math.PI/180;
 const lyingOffset=(o.category==='soldier'?(o.supineBlend||0):0)*(sz[1]||1.7)*oScale*.5;
 let m=mul(T(o.x+(o.swayX||0)+Math.sin(faceYaw)*lyingOffset,o.y??o.sourceY??0,o.z+(o.swayZ||0)+Math.cos(faceYaw)*lyingOffset),ry(faceYaw));`,
    '角色中心'
  );

  // Immediately use the neutral fixed bones for any struck soldier: no Knock_Down clip, no second fall.
  replaceOnce(
    'const animator=o.flyAnim||((o.crushed&&npcDown)?npcDown:m.animator);',
    'const animator=o.crushed?(npcIdle||m.animator):(o.flyAnim||m.animator);',
    '平躺動畫'
  );

  // Compute the lowest extent of the rotated character's actual model-sized box.
  // This accounts for both axes throughout the fall and rotation, not just at rest.
  replaceOnce(
    'function hitSoldier(o,originX=foundation.x,originZ=foundation.z,blast=false){',
    `function soldierGroundHeight(o){
 const dims=o.size||[1.12,1.7,.86],scale=o.scale||1;
 const wx=dims[0]*scale,hy=dims[1]*scale,dz=dims[2]*scale;
 const ax=o.tiltX||0,az=o.tiltZ||0;
 const ca=Math.cos(ax),sa=Math.sin(ax),cb=Math.cos(az),sb=Math.sin(az);
 const minY=-Math.abs(ca*sb)*wx*.5+Math.min(0,ca*cb*hy)-Math.abs(sa)*dz*.5;
 return -minY+.035;
}
function hitSoldier(o,originX=foundation.x,originZ=foundation.z,blast=false){`,
    '模型防穿地'
  );

  replaceOnce(
    'o.crushed=true;o.flyClock=0;o.flyFromY=o.y||0;o.flyLife=blast?1.8:1.5;',
    'o.crushed=true;o.flyClock=0;o.flyFromY=o.y||0;o.flyLife=blast?1.8:1.5;o.supineBlend=1;o.landed=false;',
    '擊倒初始化'
  );

  // The very first frame of impact is already a supine rigid-body knockback.
  // Do not let the GLB Knock_Down clip run BEFORE the flight or on landing.
  replaceOnce(
    `o.flyVY=blast?9.2:6.4;o.tiltX=0;o.tiltZ=0;
 // Reuse the green cadet's actual Knock_Down clip, with an independent rig per hit.
 const high=cache.get(modelPath(o));
 if(high?.geo.skin&&high.g?.json?.skins?.length){
  try{const a=new RigAnimator(high.g);a.setClip(a.hasClip('Knock_Down')?'Knock_Down':'Idle_11',{restart:true});a.evaluate(0);o.flyAnim=a;}catch(e){console.warn('NPC 擊倒動畫無法建立',e)}
 }`,
    `o.flyVY=blast?9.2:6.4;
 // One pose, one flight, one landing. No internal fall animation.
 o.tiltX=-Math.PI*.5;o.tiltZ=0;o.flyAnim=null;
 o.y=Math.max(o.y||0,soldierGroundHeight(o));`,
    '移除重複擊倒動畫'
  );

  // Only a brand-new game resets bodies; cleanup between rounds leaves them lying there.
  replaceOnce(
    'o.flyAnim=null;o.flyClock=undefined;o.flyVX=0;o.flyVZ=0;o.flyVY=0;',
    'o.flyAnim=null;o.flyClock=undefined;o.flyVX=0;o.flyVZ=0;o.flyVY=0;o.supineBlend=0;o.landed=false;',
    '重新開局重置'
  );

  replaceOnce(
`for(const o of soldiers){if(!o.crushed||o.flyClock===undefined||o.flyClock>o.flyLife+1)continue;
  o.flyClock+=dt;o.flyAnim?.evaluate(dt);
  if(o.flyClock<=o.flyLife){o.flyVY-=17*dt;o.x+=o.flyVX*dt;o.z+=o.flyVZ*dt;o.y+=o.flyVY*dt;
   o.tiltZ=Math.sin(Math.min(1,o.flyClock/o.flyLife)*Math.PI)*.85;
   if(o.y<=.01){o.y=.01;o.flyVY=Math.abs(o.flyVY)*.20;o.flyVX*=.72;o.flyVZ*=.72;}
   o.flyVX*=Math.exp(-.8*dt);o.flyVZ*=Math.exp(-.8*dt);
  }else{o.y=Math.max(.01,(o.y||0)-dt*2.5);o.tiltZ=1.30;o.flyAnim?.evaluate(0);}
 }`,
`for(const o of soldiers){
  if(!o.crushed||o.flyClock===undefined||o.flyClock>o.flyLife+1)continue;
  o.flyClock+=dt;
  // Already face-up on the FIRST impact frame. No pose switch mid-flight.
  o.tiltX=-Math.PI*.5;o.tiltZ=0;
  const floor=soldierGroundHeight(o);
  if(!o.landed){
    o.flyVY-=17*dt;
    o.x+=o.flyVX*dt;o.z+=o.flyVZ*dt;o.y+=o.flyVY*dt;
    if(o.y<=floor){
      o.y=floor;o.flyVY=0;o.landed=true;
    }
    const drag=Math.exp(-.9*dt);
    o.flyVX*=drag;o.flyVZ*=drag;
  }else{
    // Slide briefly after impact, remaining face-up on top of the floor.
    o.x+=o.flyVX*dt;o.z+=o.flyVZ*dt;o.y=floor;
    const drag=Math.exp(-13*dt);
    o.flyVX*=drag;o.flyVZ*=drag;
  }
  if(o.flyClock>=o.flyLife){
    o.landed=true;o.flyVX=0;o.flyVZ=0;o.flyVY=0;
    o.y=floor;
  }
 }`,
    '飛行與落地姿勢'
  );

  // ARMY3 v1.61: replace old synthesized blanket audio calls with precise SFX events.
  // The previous NPC supine fix above remains unchanged. No physics or score adjustments.
  replaceOnce('playTap();falling=',
    'window.dispatchEvent(new CustomEvent("army:blanket:drop"));falling=', '放置棉被聲');
  replaceOnce('playStackImpact(accuracy,stack.length);',
    'window.dispatchEvent(new CustomEvent("army:blanket:land",{detail:{accuracy,layers:stack.length,successful:risk.value<1}}));', '棉被接觸聲');
  replaceOnce("say('棉被塔倒塌！',2.4);playCollapse();",
    "say('棉被塔倒塌！',2.4);window.dispatchEvent(new CustomEvent('army:blanket:topple'));", '棉被塔倒塌聲');
  replaceOnce('if(risk.value>.62)playCreak(risk.value);',
    "if(risk.value>.62)window.dispatchEvent(new CustomEvent('army:blanket:tension'));", '棉被拉扯聲');
  replaceOnce('playBlast();squashPoint(',
    "window.dispatchEvent(new CustomEvent('army:blanket:blast'));squashPoint(", '地雷爆炸聲');
  replaceOnce("if(o.category==='building'){roundBuildings++;totalBuildings++}",
    "if(o.category==='building'){roundBuildings++;totalBuildings++;window.dispatchEvent(new CustomEvent('army:blanket:building'))}", '建築破壞聲');
  replaceOnce("$('cleanup').addEventListener('click',finishRound);",
    `$('cleanup').addEventListener('click',()=>{
   const button=$('cleanup');if(button.disabled)return;
   if(state==='flying'&&!button.classList.contains('confirming')){
    button.classList.add('confirming');button.textContent='再按一次結束';
    return;
   }
   button.classList.remove('confirming');
   window.dispatchEvent(new CustomEvent('army:blanket:cashout',{detail:{layers:state==='collapseDone'?collapseSavedLayers:stack.length,round}}));finishRound();
  });`,
    '收拾棉被金幣得分聲');

  // ARMY3 v1.80: dispatch REAL three-round results after the original scoring/UI is done.
  // Achievements are only presentation and do not change any score, physics or sound rules.
  replaceOnce(
    " $('overlay').hidden=false;\n}\nfunction worldToScreen(",
    " $('overlay').hidden=false;\n window.dispatchEvent(new CustomEvent('army:blanket:finished',{detail:{score,best,total,rounds:roundResults.map(r=>({...r})),totals:{friends:totalCrushed,buildings:totalBuildings,mines:totalMines}}}));\n}\nfunction worldToScreen(",
    '棉被成就與鑑測報告');

  // The scene was already fetched into the browser cache during camp exploration.
  source=source.replace("fetch('./blanket-stack-scene.json?v=153',{cache:'no-cache'})","fetch('./blanket-stack-scene.json?v=153',{cache:'default'})");
  // Warm-frame return uses the updated camp session module, not Safari's older cached copy.
  source=source.replaceAll('campSession.js?v=144','campSession.js?v=190');
  // Relative imports from a temporary module need an absolute URL base.
  source = source.replace(/(\bfrom\s+)(['"])(\.\/[^'"]+)\2/g,
    (_all,prefix,quote,path)=>prefix+quote+new URL(path,location.href).href+quote);
  const moduleURL = URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
  try { await import(moduleURL); }
  finally { URL.revokeObjectURL(moduleURL); }
} catch (e) {
  console.error('棉被 NPC 修正載入失敗',e);
  const fatal=document.getElementById('fatal');
  document.getElementById('reason').textContent=e?.message||String(e);
  fatal.hidden=false;
  document.getElementById('reload').onclick=()=>location.reload();
}
</script>
<script>
(()=>{const guide=document.getElementById('tapGuide'),play=document.getElementById('play');let timer;
 const hide=()=>{guide.hidden=true;clearTimeout(timer)};
 play.addEventListener('click',()=>{queueMicrotask(()=>{if(document.getElementById('overlay').hidden){guide.hidden=false;clearTimeout(timer);timer=setTimeout(hide,6000)}})});
 document.getElementById('field').addEventListener('pointerdown',hide,{passive:true});
 document.getElementById('cleanup').addEventListener('click',hide);
})();
</script>
</body></html>
